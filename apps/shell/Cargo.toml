[package]
name = "glassview-shell"
version = "0.2.0"
description = "GlassView native shell"
authors = ["GlassView"]
license = "MIT"
edition = "2021"

[[bin]]
name = "glassview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-global-shortcut = "2"
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging", 
  "Win32_Graphics_Dwm", 
  "Win32_UI_HiDpi"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
png = "0.17"
screenshots = "0.7"
