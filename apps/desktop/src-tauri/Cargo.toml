[package]
name = "glassview-desktop"
version = "0.1.0"
description = "GlassView native shell"
authors = ["GlassView"]
license = "MIT"
edition = "2021"

[[bin]]
name = "glassview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
png = "0.17"
screenshots = "0.7"
